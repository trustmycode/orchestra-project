server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:orchestra}
spring.datasource.username=${POSTGRES_APP_USER:orchestra_app}
spring.datasource.password=${POSTGRES_APP_PASSWORD}
spring.datasource.hikari.connection-init-sql=SELECT set_config('app.current_tenant', '${orchestra.tenant-id}', false)

# Flyway should run as superuser/owner to manage roles and RLS
spring.flyway.user=${SPRING_FLYWAY_USER:orchestra}
spring.flyway.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USER:orchestra}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure.web=INFO
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.boot.autoconfigure.amqp=INFO
logging.level.com.orchestra=INFO

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Current public version runs in an explicit single-tenant mode. The tenant is
# configured by the server and is never accepted from a client header or token.
orchestra.tenant-id=${ORCHESTRA_TENANT_ID:00000000-0000-0000-0000-000000000000}

# S3 Configuration
orchestra.s3.endpoint=http://minio:9000
orchestra.s3.external-endpoint=http://localhost:9000
orchestra.s3.region=us-east-1
orchestra.s3.access-key=${MINIO_ACCESS_KEY}
orchestra.s3.secret-key=${MINIO_SECRET_KEY}
orchestra.s3.bucket=orchestra-artifacts

# AI & Vector Store Configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=mxbai-embed-large

spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.initialize-schema=false
# Re-use main datasource for vector store
spring.ai.vectorstore.pgvector.datasource.url=${spring.datasource.url}

# Admin Datasource (Super User with BYPASSRLS)
orchestra.admin.datasource.url=${spring.datasource.url}
orchestra.admin.enabled=${ORCHESTRA_ADMIN_ENABLED:false}
orchestra.admin.token=${ORCHESTRA_ADMIN_TOKEN:}
orchestra.admin.datasource.username=${POSTGRES_ADMIN_USER:orchestra_admin}
orchestra.admin.datasource.password=${POSTGRES_ADMIN_PASSWORD:}
orchestra.data-resolver.db.allowed-hosts=${ORCHESTRA_RESOLVER_DB_ALLOWED_HOSTS:}

# AI Service Integration
orchestra.ai-service.url=${AI_SERVICE_URL:http://ai-service:8080}
