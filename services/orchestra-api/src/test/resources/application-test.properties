spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/orchestra_test}
spring.datasource.username=${TEST_DATABASE_USER:orchestra_test}
spring.datasource.password=${TEST_DATABASE_PASSWORD:orchestra_test}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.jpa.hibernate.ddl-auto=validate

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.username=test-only
spring.rabbitmq.password=test-only
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.ollama.base-url=http://127.0.0.1:11434

orchestra.s3.endpoint=http://127.0.0.1:9000
orchestra.s3.external-endpoint=http://127.0.0.1:9000
orchestra.s3.region=us-east-1
orchestra.s3.access-key=test-only
orchestra.s3.secret-key=test-only
orchestra.s3.bucket=test-only

orchestra.admin.enabled=false
orchestra.tenant-id=00000000-0000-0000-0000-000000000000
orchestra.ai-service.url=http://127.0.0.1:8090
