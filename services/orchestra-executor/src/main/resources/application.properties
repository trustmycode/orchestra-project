spring.application.name=orchestra-executor

orchestra.tenant-id=${ORCHESTRA_TENANT_ID:00000000-0000-0000-0000-000000000000}
spring.datasource.hikari.connection-init-sql=SELECT set_config('app.current_tenant', '${orchestra.tenant-id}', false)

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USER:orchestra}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

orchestra.executor.http.allowed-hosts=${ORCHESTRA_HTTP_ALLOWED_HOSTS:}
orchestra.executor.http.allow-private-networks=${ORCHESTRA_HTTP_ALLOW_PRIVATE_NETWORKS:false}
orchestra.executor.db.allowed-hosts=${ORCHESTRA_DB_ALLOWED_HOSTS:}
orchestra.executor.db.allow-mutations=${ORCHESTRA_DB_ALLOW_MUTATIONS:false}

# Consumer reliability & DLQ config
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
