services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orchestra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestra}
      POSTGRES_USER: ${POSTGRES_USER:-orchestra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in infra/.env}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orchestra}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: orchestra-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orchestra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-13T07-53-03Z
    container_name: orchestra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
    entrypoint: |
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
         echo '...waiting for minio...'
         sleep 2
      done;

      /usr/bin/mc mb myminio/orchestra-artifacts --ignore-existing;
      exit 0;
      "
  plantuml:
    image: plantuml/plantuml-server:tomcat
    container_name: orchestra-plantuml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8080"

  orchestra-api:
    container_name: orchestra-api
    build:
      context: ../services
      dockerfile: orchestra-api/Dockerfile
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${APP_DB_HOST}:${APP_DB_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_APP_USER:-orchestra_app}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in infra/.env}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in infra/.env}
      - SPRING_FLYWAY_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      - SPRING_RABBITMQ_HOST=${APP_RABBITMQ_HOST}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infra/.env}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/.env}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
      - ORCHESTRA_TENANT_ID=${ORCHESTRA_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      - ORCHESTRA_ADMIN_ENABLED=${ORCHESTRA_ADMIN_ENABLED:-false}
      - ORCHESTRA_ADMIN_TOKEN=${ORCHESTRA_ADMIN_TOKEN:-}
      - POSTGRES_ADMIN_USER=${POSTGRES_ADMIN_USER:-orchestra_admin}
      - POSTGRES_ADMIN_PASSWORD=${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in infra/.env}
      - ORCHESTRA_RESOLVER_DB_ALLOWED_HOSTS=${ORCHESTRA_RESOLVER_DB_ALLOWED_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  orchestra-executor:
    container_name: orchestra-executor
    build:
      context: ../services
      dockerfile: orchestra-executor/Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${APP_DB_HOST}:${APP_DB_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_APP_USER:-orchestra_app}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in infra/.env}
      - SPRING_RABBITMQ_HOST=${APP_RABBITMQ_HOST}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infra/.env}
      - ORCHESTRA_TENANT_ID=${ORCHESTRA_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      - ORCHESTRA_HTTP_ALLOWED_HOSTS=${ORCHESTRA_HTTP_ALLOWED_HOSTS:-}
      - ORCHESTRA_HTTP_ALLOW_PRIVATE_NETWORKS=${ORCHESTRA_HTTP_ALLOW_PRIVATE_NETWORKS:-false}
      - ORCHESTRA_DB_ALLOWED_HOSTS=${ORCHESTRA_DB_ALLOWED_HOSTS:-postgres}
      - ORCHESTRA_DB_ALLOW_MUTATIONS=${ORCHESTRA_DB_ALLOW_MUTATIONS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    container_name: orchestra-ai-service
    build:
      context: ../services
      dockerfile: ai-service/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${APP_DB_HOST}:${APP_DB_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_APP_USER:-orchestra_app}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in infra/.env}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  orchestra-web:
    container_name: orchestra-web
    build:
      context: ../apps/orchestra-web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - orchestra-api
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
