services:
  orchestra-api:
    volumes:
      - ../services/orchestra-api/target/classes:/app/target/classes
    ports:
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:5005:5005"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${APP_DB_HOST}:${APP_DB_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_APP_USER:-orchestra_app}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in infra/.env}
      - SPRING_RABBITMQ_HOST=${APP_RABBITMQ_HOST}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infra/.env}
      - ORCHESTRA_TENANT_ID=${ORCHESTRA_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

  orchestra-executor:
    volumes:
      - ../services/orchestra-executor/target/classes:/app/target/classes
    ports:
      - "127.0.0.1:5006:5005"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${APP_DB_HOST}:${APP_DB_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_APP_USER:-orchestra_app}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in infra/.env}
      - SPRING_RABBITMQ_HOST=${APP_RABBITMQ_HOST}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infra/.env}
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

  ai-service:
    volumes:
      - ../services/ai-service/target/classes:/app/target/classes
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:5007:5005"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${APP_DB_HOST}:${APP_DB_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_APP_USER:-orchestra_app}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in infra/.env}
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
